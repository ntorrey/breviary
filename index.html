  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const s = JSON.parse(localStorage.getItem('breviary.settings') || '{}');
      if (['light', 'dark', 'black'].includes(s.theme)) document.documentElement.dataset.theme = s.theme;
      if (s.textSize) document.documentElement.style.setProperty('--text-size', s.textSize + 'px');
      if (s.font) document.documentElement.dataset.font = s.font;
    } catch {}
  </script>
