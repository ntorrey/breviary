<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Breviary</title>
  <meta name="description" content="The Liturgy of the Hours">
  <meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Breviary">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const s = JSON.parse(localStorage.getItem('breviary.settings') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      if (s.textSize) document.documentElement.style.setProperty('--text-size', s.textSize + 'px');
    } catch {}
  </script>
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="main" tabindex="-1"><p class="loading">Loading…</p></main>
  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M6 9h12"/></svg><span>Today</span></a>
    <a href="#/calendar" data-tab="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendar</span></a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>Settings</span></a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
