# Deploys the app to GitHub Pages on every push to main.
# Each deploy gets a version number (1.0.<run number>), written to version.json
# and shown in Settings. The same stamp renames the service worker's cache, so
# installed copies drop their old files and pick up the update.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: node --test

      - name: Assemble site (app files only)
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git*' --exclude '.github' --exclude '.claude' --exclude '_site' \
            --exclude 'android-app' --exclude 'node_modules' --exclude 'tests' --exclude 'reports' \
            --exclude 'tools' --exclude 'content-src' --exclude 'docs'
          touch _site/.nojekyll

      - name: Stamp version
        working-directory: _site
        run: |
          VERSION="1.0.${{ github.run_number }}"
          SHA="${GITHUB_SHA::7}"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"version":"%s","commit":"%s","built":"%s"}\n' "$VERSION" "$SHA" "$BUILT" > version.json
          sed -i "s/^const SHELL_VERSION = '[^']*';/const SHELL_VERSION = 'shell-${VERSION}-${SHA}';/" sw.js
          grep -q "shell-${VERSION}-${SHA}" sw.js
          cat version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
